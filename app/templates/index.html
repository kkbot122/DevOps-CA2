<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>shortly — links, made smaller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500;1,600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --ink:#262626; --rule:#e5e5e5; --cream:#fcfff7; --lime:#a3e635; --muted:#525252; --gray:#737373;
      font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    html, body { height:100%; overflow:hidden; }
    body { background:#fff; color:var(--ink); }
    .serif { font-family: Fraunces, "Source Serif Pro", Georgia, serif; font-style:italic; font-weight:500; letter-spacing:-0.01em; }
    .glow { position:absolute; top:-180px; right:-160px; width:620px; height:620px; pointer-events:none;
      background:radial-gradient(circle, rgba(163,230,53,.28) 0%, rgba(163,230,53,0) 65%); }
    .field { width:100%; background:#fff; border:1px solid var(--ink); border-radius:4px; padding:10px 12px; font-size:15px; outline:none; }
    .field:focus, .btn:focus-visible { outline:3px solid var(--lime); outline-offset:1px; }
    .btn { border:1px solid var(--ink); border-radius:4px; font-weight:500; cursor:pointer; transition:box-shadow .12s, transform .12s; }
    .btn:hover:not(:disabled) { box-shadow:2px 2px 0 0 var(--ink); transform:translate(-1px,-1px); }
    .btn-lime { background:var(--lime); color:var(--ink); }
    .btn-ghost { background:#fff; color:var(--ink); }
    .btn:disabled { cursor:wait; opacity:.7; }
    .card { background:var(--cream); border:1px solid var(--rule); border-radius:8px; }
    .label { display:block; margin-bottom:6px; font-size:13px; font-weight:500; }
    .muted { color:var(--gray); }
    thead th { position:sticky; top:0; background:var(--cream); }
    tbody td, tbody tr { border-top:1px solid var(--rule); }
    /* padding gives focus outlines room; negative margin cancels it so layout is unchanged */
    .form-col { padding:8px; margin:-8px; }
    ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-thumb { background:var(--rule); border-radius:3px }
  </style>
</head>
<body>
  <div class="relative flex h-full flex-col overflow-hidden">
    <div class="glow"></div>

    <div class="relative z-10 flex min-h-0 flex-1 flex-col items-center justify-center px-5 pb-10 pt-16">
      <!-- logo -->
      <div class="mb-10 flex shrink-0 items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#a3e635" viewBox="0 0 256 256" aria-hidden="true"><path d="M215.12,123.64a8,8,0,1,0-14.24-7.28,79.58,79.58,0,0,1-33.08,33.5l-16.58-37.32A40,40,0,0,0,136,40.8V24a8,8,0,0,0-16,0V40.8a40,40,0,0,0-15.22,71.74L56.69,220.75a8,8,0,1,0,14.62,6.5l25.14-56.56A95.48,95.48,0,0,0,128,176a99.13,99.13,0,0,0,31.6-5.21l25.09,56.46a8,8,0,0,0,14.62-6.5l-25-56.25A95.81,95.81,0,0,0,215.12,123.64ZM128,56a24,24,0,1,1-24,24A24,24,0,0,1,128,56Zm0,104a79.52,79.52,0,0,1-25-4l16.42-36.94a39.81,39.81,0,0,0,17.2,0l16.48,37.06A83.21,83.21,0,0,1,128,160Z"></path></svg>
        <span class="text-3xl font-semibold tracking-tight">shortly</span>
      </div>

      <main class="grid min-h-0 w-full max-w-[1100px] grid-cols-1 items-center gap-5 lg:grid-cols-2 lg:gap-12">
        <!-- left: headline + form -->
        <section class="form-col min-h-0 overflow-y-auto">
          <h1 class="text-[34px] font-semibold leading-[1.1] tracking-[-0.02em] sm:text-[44px] lg:text-[52px]">Links, made <span class="serif">actually</span> smaller.</h1>
          <p class="mt-3 text-base text-[#525252] sm:text-lg">Paste a long URL, get a short one.</p>

          <form id="shorten-form" class="mt-5 space-y-3.5">
            <div>
              <label for="url" class="label">Destination URL</label>
              <input id="url" name="url" type="url" required placeholder="https://example.com/your-long-link" class="field">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="alias" class="label">Alias <span class="muted font-normal">(optional)</span></label>
                <div class="flex overflow-hidden rounded-[4px] border border-[#262626] bg-white focus-within:outline focus-within:outline-[3px] focus-within:outline-offset-1 focus-within:outline-[#a3e635]">
                  <span id="origin" class="flex max-w-[45%] items-center truncate border-r border-[#e5e5e5] bg-[#fcfff7] px-2 text-xs text-[#737373]"></span>
                  <input id="alias" name="alias" maxlength="32" placeholder="my-link" class="min-w-0 flex-1 px-2.5 py-2.5 text-[15px] outline-none">
                </div>
              </div>
              <div>
                <label for="expiry" class="label">Expires</label>
                <select id="expiry" class="field">
                  <option value="">Never</option>
                  <option value="60">In 1 minute</option>
                  <option value="3600">In 1 hour</option>
                  <option value="86400">In 1 day</option>
                  <option value="604800">In 7 days</option>
                </select>
              </div>
            </div>
            <p id="error" role="alert" aria-live="polite" class="hidden text-sm font-medium text-red-700"></p>
            <button id="submit" class="btn btn-lime flex w-full items-center justify-center gap-2 px-5 py-3 text-base">
              <span id="spinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-[#262626]/30 border-t-[#262626]"></span>
              <span id="button-label">Shorten link</span>
            </button>
          </form>

          <div id="result" class="card mt-4 hidden p-4" aria-live="polite" style="box-shadow:2px 2px 0 0 #262626;border-color:#262626">
            <p class="text-[11px] font-semibold uppercase tracking-[0.08em] text-[#737373]">Your short link</p>
            <div class="mt-2 flex flex-wrap items-center gap-2">
              <a id="short-url" class="min-w-0 flex-1 break-all text-lg font-semibold underline decoration-[#a3e635] decoration-2 underline-offset-4" target="_blank" rel="noopener"></a>
              <button id="copy" type="button" class="btn btn-ghost px-3 py-1.5 text-sm">Copy</button>
              <a id="open" class="btn btn-lime px-3 py-1.5 text-sm" target="_blank" rel="noopener">Open</a>
            </div>
          </div>
        </section>

        <!-- right: recent links -->
        <section class="card flex h-[260px] min-h-0 flex-col self-center overflow-hidden lg:h-[440px]">
          <div class="flex shrink-0 items-center justify-between px-5 pt-4 pb-3">
            <h2 class="font-semibold">Recent links</h2>
            <span class="muted text-xs">Refreshes automatically</span>
          </div>
          <div class="min-h-0 flex-1 overflow-auto px-5 pb-3">
            <table class="w-full text-left text-sm">
              <thead class="muted text-[11px] uppercase tracking-[0.08em]">
                <tr><th class="pb-2 font-medium">Short link</th><th class="pb-2 font-medium">Destination</th><th class="pb-2 text-right font-medium">Clicks</th><th class="pb-2 text-right font-medium">Expiry</th></tr>
              </thead>
              <tbody id="recent"></tbody>
            </table>
            <p id="empty" class="muted hidden py-8 text-center text-sm">Your links will show up here.</p>
          </div>
        </section>
      </main>
    </div>

    <footer id="version" class="muted absolute inset-x-0 bottom-0 z-10 py-3 text-center text-xs">v{{ version }}</footer>
  </div>

<script>
const form=document.querySelector('#shorten-form'), errorBox=document.querySelector('#error'), result=document.querySelector('#result'), btn=document.querySelector('#submit');
document.querySelector('#origin').textContent=location.host+'/';
function friendly(status,data){if(status===422)return data.detail?.[0]?.msg||'Please check the URL and try again';if(status===403)return 'This domain is blocked';if(status===409)return 'That alias is taken';if(status===429)return `Slow down, try again in ${data.retry||'a few'} seconds`;return status>=500?'Something went wrong on our side, please retry':'Please check your details and try again'}
form.addEventListener('submit',async e=>{e.preventDefault();errorBox.classList.add('hidden');result.classList.add('hidden');btn.disabled=true;document.querySelector('#spinner').classList.remove('hidden');document.querySelector('#button-label').textContent='Shortening…';const body={url:document.querySelector('#url').value,alias:document.querySelector('#alias').value||null,expires_in_seconds:document.querySelector('#expiry').value?Number(document.querySelector('#expiry').value):null};try{const r=await fetch('/api/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){errorBox.textContent=friendly(r.status,{...d,retry:r.headers.get('Retry-After')});errorBox.classList.remove('hidden');return}document.querySelector('#short-url').textContent=d.short_url;document.querySelector('#short-url').href=d.short_url;document.querySelector('#open').href=d.short_url;result.classList.remove('hidden');refreshRecent()}catch(_){errorBox.textContent='Something went wrong on our side, please retry';errorBox.classList.remove('hidden')}finally{btn.disabled=false;document.querySelector('#spinner').classList.add('hidden');document.querySelector('#button-label').textContent='Shorten link'}});
document.querySelector('#copy').addEventListener('click',async()=>{const text=document.querySelector('#short-url').textContent;try{await navigator.clipboard.writeText(text)}catch(_){const el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();document.execCommand('copy');el.remove()}const b=document.querySelector('#copy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500)});
function expiry(value){if(!value)return 'never';const seconds=Math.ceil((new Date(value)-Date.now())/1000);if(seconds<=0)return 'expired';if(seconds<60)return `in ${seconds}s`;if(seconds<3600)return `in ${Math.ceil(seconds/60)}m`;if(seconds<86400)return `in ${Math.ceil(seconds/3600)}h`;return `in ${Math.ceil(seconds/86400)}d`}
async function refreshRecent(){try{const rows=await(await fetch('/api/links/recent?limit=10')).json();const tbody=document.querySelector('#recent');tbody.replaceChildren();document.querySelector('#empty').classList.toggle('hidden',rows.length>0);for(const x of rows){const tr=document.createElement('tr');tr.className='align-top';const short=document.createElement('a');short.href='/'+encodeURIComponent(x.code);short.textContent=x.code;short.className='font-semibold hover:underline';const original=document.createElement('td');original.className='max-w-[9rem] truncate py-2.5 pr-3 text-[#525252] sm:max-w-[12rem]';original.title=x.url;original.textContent=x.url;const clicks=document.createElement('td');clicks.className='py-2.5 text-right tabular-nums';clicks.textContent=x.clicks;const exp=document.createElement('td');exp.className='py-2.5 pl-3 text-right text-[#737373]';exp.textContent=expiry(x.expires_at);const code=document.createElement('td');code.className='py-2.5 pr-3';code.append(short);tr.append(code,original,clicks,exp);tbody.append(tr)}}catch(_){}}
async function version(){try{const x=await(await fetch('/version')).json();document.querySelector('#version').textContent=`v${x.version} · served by ${x.hostname}`}catch(_){}}
refreshRecent();version();setInterval(()=>{if(!document.hidden)refreshRecent()},5000);
</script>
</body>
</html>
