name: shortly CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'loadtest/reports/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Release demo mode
        type: choice
        options: [good, bad-errors, bad-crash]
        default: good
        required: true
      deploy:
        description: Deploy to the local minikube cluster
        type: boolean
        default: true
        required: true
      auto_rollback:
        description: Automatically undo a failed deployment
        type: boolean
        default: true
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6.0.2 # v6.0.2
      - uses: actions/setup-python@v6.1.0 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: python -m pip install ruff==0.13.2
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.2.0 # v3.2.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: Kubeconform and actionlint
        run: scripts/ci/lint-workflows.sh

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6.0.2 # v6.0.2
      - uses: actions/setup-python@v6.1.0 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=xml --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: scripts/ci/coverage-summary.sh coverage.xml
      - uses: actions/upload-artifact@v6.0.0 # v6.0.0
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  build-scan-push:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-build
      cancel-in-progress: true
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      tag: ${{ steps.variant.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      variant: ${{ steps.variant.outputs.variant }}
    steps:
      - uses: actions/checkout@v6.0.2 # v6.0.2
      - id: variant
        name: Resolve release variant
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VARIANT: ${{ inputs.variant }}
          SHA: ${{ github.sha }}
        run: scripts/ci/resolve-variant.sh
      - uses: docker/metadata-action@v5.8.0 # v5.8.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ steps.variant.outputs.tag }}
      - uses: docker/setup-buildx-action@v3.11.1 # v3.11.1
      - name: Build and load image
        uses: docker/build-push-action@v7.4.0 # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.variant.outputs.tag }}
            BAD_RELEASE_MODE=${{ steps.variant.outputs.bad_mode }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@v0.36.0 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache: true
      - name: Report high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          cache: true
      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
      - name: Scan Docker and Kubernetes configuration (report only)
        uses: aquasecurity/trivy-action@v0.36.0 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          exit-code: '0'
      - name: Configuration scan summary
        if: always()
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
        run: scripts/ci/scan-summary.sh trivy-config.txt
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
      - uses: actions/upload-artifact@v6.0.0 # v6.0.0
        with:
          name: shortly-sbom
          path: sbom.cdx.json
      - name: Push scanned image to GHCR
        id: push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: scripts/ci/push-image.sh

  deploy:
    # Never execute repository code from a PR on a self-hosted runner: fork PR code is untrusted.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, minikube]
    environment: minikube-local
    needs: [build-scan-push]
    concurrency:
      group: deploy-minikube
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.build-scan-push.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build-scan-push.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.build-scan-push.outputs.tag }}
      VARIANT: ${{ needs.build-scan-push.outputs.variant }}
      AUTO_ROLLBACK: ${{ inputs.auto_rollback != false }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2 # v6.0.2
      - name: Prepare noninteractive Docker credentials
        run: |
          docker_host=$(docker context inspect "$(docker context show)" --format '{{.Endpoints.docker.Host}}')
          config_dir="$RUNNER_TEMP/docker-config"
          mkdir -p "$config_dir"
          chmod 700 "$config_dir"
          printf '{"auths":{}}\n' > "$config_dir/config.json"
          chmod 600 "$config_dir/config.json"
          printf 'DOCKER_CONFIG=%s\nDOCKER_HOST=%s\n' "$config_dir" "$docker_host" >> "$GITHUB_ENV"
      - name: Preflight
        run: scripts/ci/preflight.sh
      - name: Deploy
        run: scripts/ci/deploy.sh "$IMAGE_REF" "$IMAGE_DIGEST"
      - name: Verify
        run: scripts/ci/verify.sh
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh
      - name: Stop preflight port-forward
        if: always()
        run: scripts/ci/cleanup.sh
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Remove temporary Docker credentials
        if: always()
        run: if [[ -n "${DOCKER_CONFIG:-}" && -d "$DOCKER_CONFIG" ]]; then rm -rf -- "$DOCKER_CONFIG"; fi
