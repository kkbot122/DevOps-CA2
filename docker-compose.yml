services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  app:
    image: python:3.12-slim
    working_dir: /service
    volumes:
      - .:/service
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
