---
docker_install: auto
docker_extra_users: []
docker_arch_map:
  x86_64: amd64
  aarch64: arm64
docker_daemon_config: /etc/docker/daemon.json
docker_keyring_dir: /etc/apt/keyrings
docker_keyring_path: /etc/apt/keyrings/docker.gpg
docker_key_download_path: /tmp/docker.asc
docker_repository_name: docker
