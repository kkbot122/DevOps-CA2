apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shortly
  namespace: urlshortener
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/part-of: shortly
    app.kubernetes.io/component: api
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - urlshortener
  selector:
    matchLabels:
      app.kubernetes.io/name: shortly
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
